name: loon-sim CI

on:
  push:
    paths: ['plugins/**', 'tools/loon-sim/**']
  pull_request:
    paths: ['plugins/**', 'tools/loon-sim/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: loon-sim 全套回归
        run: sh tools/loon-sim/ci.sh plugins
