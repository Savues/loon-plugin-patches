name: Sync blockAds

on:
  schedule:
    # 每 6 小时一次。GitHub 的定时任务实际执行常延迟 1-6 小时，别指望准点。
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blockads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认脚本齐备
        run: |
          for f in patches/patch-blockads.py patches/verify-artifact.py; do
            test -f "$f" || { echo "::error::$f 不存在"; exit 1; }
          done

      - name: 拉取上游并施加补丁
        run: |
          mkdir -p plugins/BlockAds-Patched
          python3 patches/patch-blockads.py -o plugins/BlockAds-Patched/BlockAds.patched.plugin

      - name: 校验退场完整 + 产物结构合法
        run: python3 patches/verify-artifact.py plugins/BlockAds-Patched/BlockAds.patched.plugin

      - name: 确认补丁可重放（幂等）
        run: |
          # 产物若不能被原样重放，Actions 每次跑都会产生新 diff，持续刷屏。
          python3 patches/patch-blockads.py \
            plugins/BlockAds-Patched/BlockAds.patched.plugin -o /tmp/replay.plugin
          cmp -s /tmp/replay.plugin plugins/BlockAds-Patched/BlockAds.patched.plugin || {
            echo "::error::补丁不幂等，第二次重放结果与首次不同"; exit 1; }
          echo "::notice::重放一致"

      - name: 生成差异报告
        id: diff
        run: |
          if git diff --quiet -- plugins/BlockAds-Patched/BlockAds.patched.plugin; then
            echo "上游无变化，补丁产物与上次一致。" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游有更新：" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- plugins/BlockAds-Patched/BlockAds.patched.plugin \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff -U0 -- plugins/BlockAds-Patched/BlockAds.patched.plugin \
              | grep -E '^[+-][^+-]' | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/BlockAds-Patched/BlockAds.patched.plugin
          git commit -m "chore: 同步 blockAds 上游更新并重施补丁

          由 .github/workflows/sync-blockads.yml 自动生成
          补丁器: patches/patch-blockads.py"
          # 可能有人（别的会话/手动）在这期间推了 main，裸 push 会直接失败。
          # 撞车时把本分支的产物提交重放到远端最新之上再推。
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "::warning::push 失败（第 $i 次），rebase 到远端最新后重试"
            git pull --rebase origin main
          done
          echo "::error::重试 3 次仍无法推送"
          exit 1

      - name: 无变化时结束
        if: steps.diff.outputs.changed == 'false'
        run: echo "上游无更新，无需提交。"
