<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小镇模拟器 · 插件验证</title>
<style>
  :root { --gold:#FFC814; --bg:#1b1006; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
         background:radial-gradient(circle at 50% 0%,#3a2410,#1b1006 70%); color:#fff; min-height:100vh; }
  .bar { padding:14px 16px 6px; display:flex; gap:14px; flex-wrap:wrap; font-size:14px; }
  .bar b { color:var(--gold); font-size:18px; }
  .badge { background:#0006; border:1px solid #ffffff22; border-radius:999px; padding:4px 10px; }
  .stage { position:relative; height:300px; margin:10px 16px; border-radius:20px;
           background:linear-gradient(180deg,#4a2f12,#2a1a09); border:1px solid #ffffff14; overflow:hidden; }
  .tom { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-size:76px; }
  .hint { position:absolute; left:0; right:0; bottom:12px; text-align:center; color:#ffffff88; font-size:12px; }
  .hd_normal_mainbtn { position:absolute; left:50%; bottom:44px; transform:translateX(-50%);
      width:200px; height:64px; border-radius:32px; background:linear-gradient(180deg,#FFD84D,#F0A800);
      color:#5a2d00; font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 0 #a86f00, 0 10px 24px #0008; user-select:none; touch-action:none; }
  .hd_normal_mainbtn:active { transform:translateX(-50%) scale(.96); }
  .log { margin:12px 16px 30px; background:#00000055; border:1px solid #ffffff14; border-radius:14px;
         padding:10px 12px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:#c9f7c9;
         height:220px; overflow:auto; }
  .log div { padding:2px 0; border-bottom:1px solid #ffffff08; word-break:break-all; }
  #upgradeLayer { position:fixed; inset:0; background:#000000cc; display:none; flex-direction:column;
      align-items:center; justify-content:center; z-index:99; }
  #upgradeLayer .lottie { font-size:64px; animation:spin 1.6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hd_skip_upgrade_btn { margin-top:26px; padding:10px 22px; border-radius:999px;
      background:#ffffff1a; border:1px solid #ffffff33; color:#fff; font-size:14px; opacity:1; cursor:pointer; }
  .hd_skip_upgrade_btn span { margin:0 3px; }
</style>
</head>
<body>
  <div class="bar">
    <span class="badge">能量 <b id="energy">-</b></span>
    <span class="badge">等级 <b id="level">-</b></span>
    <span class="badge">经验 <b id="exp">-</b></span>
    <span class="badge">金币 <b id="coin">-</b></span>
    <span class="badge"><b id="state" style="font-size:13px">-</b></span>
  </div>

  <div class="stage">
    <div class="tom">🐱</div>
    <div class="hd_normal_mainbtn">长按升级</div>
    <div class="hint">长按 ≥1.5s = 满格消耗（模拟真机行为）</div>
  </div>

  <div class="log" id="log"></div>

  <div id="upgradeLayer">
    <div class="lottie">🎬</div>
    <div style="margin-top:10px;color:#fff9">升级动画播放中…</div>
    <div class="hd_skip_upgrade_btn"><span class="hd_skip_upgrade_btn_countdown">6s</span>
      <span class="hd_skip_upgrade_btn_divider">|</span>
      <span class="hd_skip_upgrade_btn_text">跳过</span></div>
  </div>

  <script src="main.js"></script>
  <script src="p_index.injected.js?v=0e4333aa"></script>
</body>
</html>
