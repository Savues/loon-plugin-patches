<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GeoFix · 定位设置</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--fg:#e6e8ee;--dim:#8b93a7;
--ok:#3ecf8e;--bad:#ff6b6b;--acc:#6ea8fe;--warn:#f5a623}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6ec;
--fg:#1a1d24;--dim:#6b7280;--acc:#2563eb}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
button:active{opacity:.7}
.primary{background:var(--acc);color:#fff}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.55}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;
line-height:1.5;margin:10px 0 0;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-active{background:rgba(62,207,142,.16);color:var(--ok)}
.b-route{background:rgba(245,166,35,.16);color:var(--warn)}
.b-pass{background:rgba(139,147,167,.16);color:var(--dim)}
.b-err{background:rgba(255,107,107,.16);color:var(--bad)}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:10px 0 0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-all}
details summary{cursor:pointer;font-size:13px;color:var(--dim);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);
padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;
pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:var(--bad);color:#fff}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11px}
.warns{color:var(--warn);font-size:12px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>GeoFix · 定位设置</h1>
  <div class="sub">本地控制页 · 由插件自己返回 · 无外部依赖</div>
  <div class="sub" id="where" style="margin-top:-8px"></div>

  <div class="card">
    <h2>状态</h2>
    <div class="status" id="st"><span class="badge b-pass">读取中…</span></div>
    <dl class="kv" id="kv"></dl>
    <details><summary>原始响应</summary><pre id="raw">—</pre></details>
  </div>

  <div class="card">
    <h2>粘贴地图链接</h2>
    <input id="link" type="url" inputmode="url" placeholder="maps.apple.com/?ll=… 或 uri.amap.com/marker?…">
    <button class="ghost" id="parse">本地解析</button>
    <div class="hint">苹果 <code>?ll=</code> 与 <code>/place/…/@lon,lat,z</code>，Google <code>@</code> 与 <code>!3d!4d</code>，高德 <code>uri.amap.com/marker</code>，百度 <code>@x,y,z</code>，以及裸坐标。全部在设备上算，结果一律换算成 WGS84。</div>
    <div class="warns" id="pwarn" hidden></div>
  </div>

  <div class="card">
    <h2>写入坐标</h2>
    <div class="row">
      <div><label for="lat">纬度 lat</label><input id="lat" type="number" step="any" inputmode="decimal" placeholder="31.230416"></div>
      <div><label for="lon">经度 lon</label><input id="lon" type="number" step="any" inputmode="decimal" placeholder="121.473701"></div>
    </div>
    <label for="acc">精度 acc（米，5–200）</label>
    <input id="acc" type="number" value="25" min="5" max="200" inputmode="numeric">
    <button class="primary" id="save">写入</button>
    <button class="danger" id="clear">恢复真实定位</button>
    <div class="hint">写入后完全退出并重开目标 App，或去「设置 → 隐私 → 定位服务」把开关拨一下，让 iOS 丢掉旧缓存。</div>
  </div>

  <div class="card">
    <h2>收藏</h2>
    <label for="preset">常用地点</label>
    <select id="preset"><option value="">— 选择或输入新地点 —</option></select>
    <div class="row">
      <div><input id="pname" type="text" placeholder="名称" autocomplete="off"></div>
      <div><input id="pcoord" type="text" placeholder="lat,lon" inputmode="decimal" autocomplete="off"></div>
    </div>
    <div class="row">
      <div><button class="ghost" id="padd">收藏</button></div>
      <div><button class="ghost" id="pdel">删除</button></div>
    </div>
    <div class="hint">存在本机 localStorage，不上传。换地点时不用再翻聊天记录。</div>
  </div>
</div>
<div id="toast"></div>

<script>
var HOST = "https://gs-loc.apple.com";
var BASE = HOST + "/geo-settings";
var PARSE = HOST + "/geo-parse";
var PKEY = "geofix.presets";
var LKEY = "geofix.last";
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }); }
function fmt(t) { return t ? new Date(t).toLocaleString("zh-CN", { hour12: false }).slice(5) : "—"; }
function toast(msg, err) {
  var t = el("toast");
  t.textContent = msg;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.className = ""; }, 2800);
}
function getStore(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function setStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function hit(path) {
  return fetch(BASE + path, { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) { throw new Error("返回的不是 JSON：插件没装，或 MITM 没生效"); }
    if (!j.ok && j.mode === undefined) throw new Error(j.error || "未知错误");
    return j;
  });
}

function render(j) {
  el("raw").textContent = JSON.stringify(j, null, 2);
  var b = { active: ["b-active", "已生效"], route: ["b-route", "路线中"], passthrough: ["b-pass", "透传中"] }[j.mode]
       || ["b-err", j.mode || "未知"];
  el("st").innerHTML = '<span class="badge ' + b[0] + '">' + esc(b[1]) + '</span>'
    + '<span style="color:var(--dim);font-size:12px">mode=' + esc(j.mode || "-") + " · v" + esc(j.moduleVersion || "-")
    + " · " + esc(j.tool || "-") + "</span>";
  var c = j.current;
  var rows = [
    ["当前坐标", c ? (c.lat + ", " + c.lon + "　±" + (c.accuracy != null ? c.accuracy : 25) + "m") : "—"],
    ["已改写次数", j.patchCount || 0],
    ["放行次数", j.passthroughCount || 0],
    ["上次写入", fmt(j.lastSettingsWriteAt)],
    ["上次改写", fmt(j.lastPatchAt)]
  ];
  if (j.route) rows.push(["路线", (j.route.name || "-") + " · " + Math.round((j.route.progress || 0) * 100) + "%"]);
  if (j.lastError) rows.push(["错误", j.lastError]);
  el("kv").innerHTML = rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("");
}

function refresh() {
  return hit("/status").then(render).catch(function (e) {
    el("st").innerHTML = '<span class="badge b-err">未连通</span>';
    el("kv").innerHTML = "";
    toast(e.message, true);
  });
}

function doSave() {
  var lat = parseFloat(el("lat").value), lon = parseFloat(el("lon").value);
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { toast("经纬度填错了", true); return Promise.resolve(false); }
  var acc = Math.max(5, Math.min(200, parseInt(el("acc").value, 10) || 25));
  return hit("/save?lat=" + lat + "&lon=" + lon + "&acc=" + acc + "&source=geofix-ui")
    .then(function () { setStore(LKEY, { lat: lat, lon: lon, acc: acc }); toast("已写入 " + lat + ", " + lon); setTimeout(refresh, 400); return true; });
}
el("save").onclick = function () { doSave().catch(function (e) { toast(e.message, true); }); };

el("clear").onclick = function () {
  if (!confirm("恢复成真实定位？")) return;
  hit("/clear").then(function () { toast("已恢复"); setTimeout(refresh, 400); }).catch(function (e) { toast(e.message, true); });
};

function doParse(u) {
  var w = el("pwarn");
  w.hidden = true;
  return fetch(PARSE + "?u=" + encodeURIComponent(u), { cache: "no-store" })
    .then(function (r) {
      return r.json().then(function (j) { if (!r.ok || j.lat === undefined) throw new Error(j.error || "解析失败"); return j; });
    })
    .then(function (j) {
      // 解析器会把清洗后的串回传（只发生清洗时才有），输入框改写成干净版本
      if (j.input) el("link").value = j.input;
      el("lat").value = j.lat;
      el("lon").value = j.lon;
      var txt = "解析到 " + (j.name || "未命名") + " · 原始坐标系 " + j.originalSystem;
      if (j.input) txt = "已忽略前导文字，只取 http 开头的部分\n" + txt;
      if (j.warnings && j.warnings.length) txt += " · " + j.warnings.join("；");
      w.textContent = txt;
      w.hidden = false;
      toast("解析完成");
      return j;
    });
}
el("parse").onclick = function () {
  var u = el("link").value.trim();
  if (!u) { toast("先粘个链接", true); return; }
  doParse(u).catch(function (e) { toast(e.message, true); });
};

function presets() { return getStore(PKEY, {}); }
function fillPreset() {
  var p = presets(), sel = el("preset"), cur = sel.value;
  var keys = Object.keys(p);
  sel.innerHTML = '<option value="">— 选择或输入新地点 —</option>'
    + keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
  if (cur && p[cur]) sel.value = cur;
}
el("preset").onchange = function () {
  var p = presets()[el("preset").value];
  if (!p) return;
  el("pname").value = el("preset").value;
  el("pcoord").value = p[0] + "," + p[1];
  el("lat").value = p[0];
  el("lon").value = p[1];
  toast("已填入");
};
el("padd").onclick = function () {
  var n = el("pname").value.trim(), c = el("pcoord").value.trim().split(/[,\s]+/);
  if (!n || c.length < 2 || !isFinite(+c[0]) || !isFinite(+c[1])) { toast("名称或坐标不对", true); return; }
  var p = presets();
  p[n] = [+c[0], +c[1]];
  setStore(PKEY, p);
  fillPreset();
  el("preset").value = n;
  el("lat").value = c[0];
  el("lon").value = c[1];
  toast("已收藏 " + n);
};
el("pdel").onclick = function () {
  var n = el("preset").value;
  if (!n) { toast("先选一个", true); return; }
  var p = presets();
  delete p[n];
  setStore(PKEY, p);
  fillPreset();
  toast("已删除 " + n);
};

el("where").textContent = "当前地址 " + location.host;

/* 快捷指令入口：从分享菜单喂链接过来时，地址形如
   https://map.com/?u=<URL 编码后的链接>
   自动解析并填好；带 &auto=1 则解析完直接写入。 */
(function () {
  var q = new URLSearchParams(location.search);
  var u = q.get("u");
  if (!u) return;
  el("link").value = u;
  doParse(u).then(function () {
    if (q.get("auto") === "1") return doSave();
  }).catch(function (e) { toast(e.message, true); });
})();
var last = getStore(LKEY, null);
if (last) { el("lat").value = last.lat; el("lon").value = last.lon; el("acc").value = last.acc; }
fillPreset();
refresh();
</script>
</body>
</html>
