<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GeoFix · 定位设置</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--fg:#e6e8ee;--dim:#8b93a7;
--ok:#3ecf8e;--bad:#ff6b6b;--acc:#6ea8fe;--warn:#f5a623;--r:14px}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6ec;
--fg:#1a1d24;--dim:#6b7280;--acc:#2563eb}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.03em}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:600;
cursor:pointer;margin-top:10px;transition:opacity .15s}
button:active{opacity:.7}
.primary{background:var(--acc);color:#fff}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.55}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
font-size:12px;line-height:1.5;overflow-x:auto;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.b-active{background:rgba(62,207,142,.16);color:var(--ok)}
.b-route{background:rgba(245,166,35,.16);color:var(--warn)}
.b-pass{background:rgba(139,147,167,.16);color:var(--dim)}
.b-err{background:rgba(255,107,107,.16);color:var(--bad)}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);
background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:var(--bad);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:10px 0 0}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:13px;color:var(--dim);margin-top:10px}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>GeoFix · 定位设置</h1>
  <div class="sub">网络定位重定向 · 仅用于自有或获授权设备</div>

  <div class="card">
    <h2>状态</h2>
    <div class="status" id="st"><span class="badge b-pass">读取中…</span></div>
    <dl class="kv" id="kv"></dl>
    <details><summary>原始响应</summary><pre id="raw">—</pre></details>
  </div>

  <div class="card">
    <h2>写入坐标</h2>
    <div class="row">
      <div><label for="lat">纬度 lat</label><input id="lat" type="number" step="any" inputmode="decimal" placeholder="31.230416"></div>
      <div><label for="lon">经度 lon</label><input id="lon" type="number" step="any" inputmode="decimal" placeholder="121.473701"></div>
    </div>
    <label for="acc">精度 acc（米，5–200）</label>
    <input id="acc" type="number" value="25" min="5" max="200" inputmode="numeric">
    <button class="primary" id="save">写入</button>
    <button class="danger" id="clear">恢复真实定位</button>
    <div class="hint">写入后完全退出并重开目标 App，或去「设置 → 隐私 → 定位服务」把开关拨一下，让 iOS 丢掉旧缓存。</div>
  </div>

  <div class="card">
    <h2>从地图链接解析</h2>
    <label for="worker">解析服务地址</label>
    <input id="worker" type="url" inputmode="url" placeholder="https://geofix-parse.你的子域.workers.dev">
    <label for="link">粘贴分享链接</label>
    <input id="link" type="url" inputmode="url" placeholder="maps.apple.com/?ll=… 或 uri.amap.com/marker?…">
    <button class="ghost" id="parse">解析并填入</button>
    <div class="hint">支持苹果 <code>?ll=</code>、<code>/place/…/@lon,lat,z</code>，Google <code>@</code> 与 <code>!3d!4d</code>，高德 <code>uri.amap.com/marker</code>，百度 <code>@x,y,z</code>，以及裸坐标。<br>
    解析在<strong>你自己部署的</strong>服务上跑（见插件的 <code>companion/worker/</code>）。也可以跳过这步，直接把经纬度填进上面。</div>
  </div>
</div>
<div id="toast"></div>

<script>
const GS = 'https://gs-loc.apple.com/geo-settings';
const $ = (id) => document.getElementById(id);
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const fmt = (t) => (!t ? '—' : new Date(t).toLocaleString('zh-CN', { hour12: false }).slice(5));
const toast = (msg, err) => {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ''), 2800);
};

async function hit(path) {
  const res = await fetch(GS + path, { cache: 'no-store' });
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); } catch { throw new Error('返回的不是 JSON：插件没装，或 MITM 没生效'); }
  if (!j.ok && j.mode === undefined) throw new Error(j.error || '未知错误');
  return j;
}

function render(j) {
  $('raw').textContent = JSON.stringify(j, null, 2);
  const b = { active: ['b-active', '已生效'], route: ['b-route', '路线中'], passthrough: ['b-pass', '透传中'] }[j.mode]
         || ['b-err', j.mode || '未知'];
  $('st').innerHTML = `<span class="badge ${b[0]}">${b[1]}</span>` +
    `<span style="color:var(--dim);font-size:12px">mode=${j.mode || '-'} · v${j.moduleVersion || '-'} · ${j.tool || '-'}</span>`;
  const c = j.current;
  const rows = [
    ['当前坐标', c ? `${c.lat}, ${c.lon}　±${c.accuracy != null ? c.accuracy : 25}m` : '—'],
    ['已改写次数', j.patchCount ?? 0],
    ['放行次数', j.passthroughCount ?? 0],
    ['上次写入', fmt(j.lastSettingsWriteAt)],
    ['上次改写', fmt(j.lastPatchAt)],
  ];
  if (j.route) rows.push(['路线', `${j.route.name || '-'} · ${Math.round((j.route.progress || 0) * 100)}%`]);
  $('kv').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  if (j.lastError) toast('插件报错：' + j.lastError, true);
}

async function refresh() {
  try { render(await hit('/status')); }
  catch (e) { $('st').innerHTML = '<span class="badge b-err">未连通</span>'; $('kv').innerHTML = ''; toast(e.message, true); }
}

$('save').onclick = async () => {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return toast('经纬度填错了', true);
  const acc = Math.max(5, Math.min(200, parseInt($('acc').value, 10) || 25));
  try {
    await hit('/save?lat=' + lat + '&lon=' + lon + '&acc=' + acc + '&source=geofix-web');
    store.set('last', { lat, lon, acc });
    toast('已写入 ' + lat + ', ' + lon);
    setTimeout(refresh, 400);
  } catch (e) { toast(e.message, true); }
};

$('clear').onclick = async () => {
  if (!confirm('恢复成真实定位？')) return;
  try { await hit('/clear'); toast('已恢复'); setTimeout(refresh, 400); }
  catch (e) { toast(e.message, true); }
};

$('parse').onclick = async () => {
  const u = $('link').value.trim();
  const w = $('worker').value.trim().replace(/\/+$/, '');
  if (!u) return toast('先粘个链接', true);
  if (!w) return toast('先填上解析服务地址', true);
  try {
    const r = await fetch(w + '/api/parse?format=json&u=' + encodeURIComponent(u));
    const j = await r.json();
    if (!r.ok || j.lat === undefined) throw new Error(j.error || '解析失败');
    $('lat').value = j.lat; $('lon').value = j.lon;
    if (j.accuracy) $('acc').value = j.accuracy;
    toast('解析到 ' + (j.name || '未命名') + '：' + j.lat + ', ' + j.lon);
    if (j.warnings && j.warnings.length) setTimeout(() => toast(j.warnings[0], true), 2900);
  } catch (e) { toast(e.message, true); }
};

$('worker').value = store.get('worker', '');
$('worker').onchange = () => store.set('worker', $('worker').value.trim());
const last = store.get('last', null);
if (last) { $('lat').value = last.lat; $('lon').value = last.lon; $('acc').value = last.acc; }
refresh();
</script>
</body>
</html>
